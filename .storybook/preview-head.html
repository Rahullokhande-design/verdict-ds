<!--
  Instrument Sans for the interface, Geist Mono for every number.

  The mono is not a stylistic tic. Money, card digits, scores, fingerprints and
  timers all need tabular figures: a value that changes width as it updates
  makes a column impossible to scan, and this is an interface someone scans
  four hundred times a shift.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --font-instrument-sans: "Instrument Sans";
    --font-geist-mono: "Geist Mono";
  }
</style>
